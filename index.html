
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#100923">
  <title>HANOON WORLD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: "Cairo", sans-serif;
      background: #100923;
      color: white;
    }

    .splash {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;

      background:
        linear-gradient(
          180deg,
          rgba(10, 5, 25, .25),
          rgba(10, 5, 25, .62) 65%,
          #100923
        ),
        url("https://images8.alphacoders.com/138/1382788.png");

      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      padding: 25px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      animation: appear 1.2s ease both;
    }

    .logo {
      width: 112px;
      height: 112px;
      border-radius: 32px;
      display: grid;
      place-items: center;
      font-size: 58px;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(145deg, #a875ff, #5423a5);
      border: 1px solid rgba(255,255,255,.45);
      box-shadow:
        0 0 35px rgba(158, 91, 255, .65),
        inset 0 0 20px rgba(255,255,255,.2);
      margin-bottom: 25px;
    }

    h1 {
      font-size: clamp(34px, 8vw, 58px);
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 4px 25px #000;
    }

    .subtitle {
      margin-top: 9px;
      color: #e1d4ff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .loader {
      width: 48px;
      height: 48px;
      margin-top: 55px;
      border-radius: 50%;
      border: 3px solid rgba(255,255,255,.2);
      border-top-color: #d6b7ff;
      animation: spin .9s linear infinite;
    }

    .loading-text {
      margin-top: 15px;
      color: #d9c8ff;
      font-size: 12px;
      letter-spacing: 2px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 600px) {
      .splash {
        background-position: 55% center;
      }

      .logo {
        width: 96px;
        height: 96px;
        font-size: 48px;
      }

      .loader {
        margin-top: 45px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .content { animation: none; }
      .loader { animation-duration: 2s; }
    }
  </style>
</head>

<body>
  <main class="splash">
    <section class="content">
      <div class="logo">H</div>

      <h1>HANOON</h1>
      <div class="subtitle">WORLD · عالم يجمعنا</div>

      <div class="loader"></div>
      <p class="loading-text">جاري الدخول إلى عالم هنون</p>
    </section>
  </main>

  <script>
    // الانتقال مرة واحدة بعد خمس ثوانٍ كاملة
    window.addEventListener("load", () => {
      setTimeout(() => {
        window.location.replace("./login.html");
      }, 5000);
    });
  </script>
</body>
</html>
