<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090b18">
  <title>الألعاب | HANOON WORLD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #090b18;
      --panel: rgba(20, 24, 43, .88);
      --panel-light: rgba(31, 36, 61, .88);
      --purple: #a18aff;
      --purple-dark: #7354d9;
      --gold: #edca83;
      --cyan: #68d9d5;
      --text: #f7f5ff;
      --muted: #a6a8bd;
      --line: rgba(255,255,255,.09);
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Cairo", sans-serif;
      padding-bottom: 100px;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(
          180deg,
          rgba(7,9,20,.48),
          rgba(7,9,20,.82) 45%,
          #090b18 100%
        ),
        url("https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=2200&q=90")
        center top / cover no-repeat;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 10% 15%, rgba(125,91,230,.20), transparent 35%),
        radial-gradient(ellipse at 90% 35%, rgba(48,174,183,.12), transparent 35%);
    }

    .app {
      width: min(100%, 1450px);
      margin: auto;
      padding: 0 25px;
    }

    /* HEADER */

    .topbar {
      min-height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255,255,255,.055);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .brand-icon {
      width: 47px;
      height: 47px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: linear-gradient(145deg, #b49aff, #6845ce);
      border: 1px solid rgba(255,255,255,.3);
      box-shadow: 0 8px 28px rgba(126,91,226,.35);
    }

    .brand-icon svg {
      width: 27px;
      height: 27px;
      stroke: white;
      fill: none;
      stroke-width: 1.7;
    }

    .brand-name {
      font-size: 17px;
      font-weight: 900;
      letter-spacing: .5px;
    }

    .brand-sub {
      display: block;
      color: var(--gold);
      font-size: 9px;
      letter-spacing: 3px;
      margin-top: -5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .wallet {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      background: rgba(22,25,46,.88);
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .wallet-unit {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 900;
    }

    .wallet-unit svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: var(--gold);
      stroke-width: 1.8;
    }

    .wallet-unit.gems svg {
      stroke: var(--cyan);
    }

    .wallet-add {
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(145deg, #aa91ff, #704ed4);
    }

    .wallet-add svg {
      width: 17px;
      height: 17px;
      stroke: white;
      fill: none;
      stroke-width: 2.4;
    }

    .profile-link {
      width: 43px;
      height: 43px;
      overflow: hidden;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #24243d;
      border: 2px solid var(--purple);
    }

    .profile-link img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-link svg {
      width: 22px;
      height: 22px;
      stroke: #cbbdff;
      fill: none;
      stroke-width: 1.7;
    }

    /* HERO */

    .hero {
      position: relative;
      min-height: 330px;
      margin-top: 25px;
      padding: 40px;
      display: flex;
      align-items: center;
      overflow: hidden;
      isolation: isolate;
      border-radius: 30px;
      border: 1px solid rgba(190,171,255,.2);
      background:
        linear-gradient(
          90deg,
          rgba(10,11,28,.96) 0%,
          rgba(12,12,30,.78) 50%,
          rgba(12,12,30,.22) 100%
        ),
        url("https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1800&q=90")
        center / cover no-repeat;
      box-shadow: var(--shadow);
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background:
        radial-gradient(circle at 75% 40%, rgba(140,103,255,.18), transparent 35%),
        linear-gradient(0deg, rgba(7,9,20,.45), transparent);
    }

    .hero-content {
      max-width: 590px;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--gold);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 7px 13px;
      border: 1px solid rgba(237,202,131,.25);
      border-radius: 30px;
      background: rgba(237,202,131,.08);
    }

    .hero-label span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 12px var(--gold);
    }

    .hero h1 {
      margin-top: 19px;
      font-size: clamp(32px, 5vw, 53px);
      line-height: 1.35;
      font-weight: 900;
      text-shadow: 0 5px 24px rgba(0,0,0,.45);
    }

    .hero h1 strong {
      color: #c2adff;
    }

    .hero p {
      margin-top: 12px;
      max-width: 480px;
      color: #d0cce0;
      font-size: 13px;
      line-height: 2.1;
    }

    .hero-decoration {
      position: absolute;
      left: 7%;
      top: 50%;
      transform: translateY(-50%);
      width: 190px;
      height: 190px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.035);
      box-shadow: 0 0 80px rgba(145,112,255,.15);
    }

    .hero-decoration::before,
    .hero-decoration::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(190,171,255,.15);
    }

    .hero-decoration::before {
      inset: 15px;
    }

    .hero-decoration::after {
      inset: 30px;
    }

    .hero-decoration svg {
      width: 80px;
      height: 80px;
      stroke: #c8b8ff;
      fill: none;
      stroke-width: 1.1;
      filter: drop-shadow(0 0 18px rgba(170,140,255,.6));
    }

    /* SEARCH */

    .search-section {
      margin-top: 27px;
    }

    .search-box {
      width: 100%;
      min-height: 58px;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 18px;
      background: rgba(21,24,44,.91);
      border: 1px solid rgba(174,151,255,.18);
      border-radius: 17px;
      box-shadow: 0 12px 35px rgba(0,0,0,.2);
      transition: .2s;
    }

    .search-box:focus-within {
      border-color: rgba(174,151,255,.6);
      box-shadow: 0 0 0 3px rgba(151,121,255,.1);
    }

    .search-box svg {
      width: 22px;
      height: 22px;
      flex: none;
      stroke: #bbaaff;
      fill: none;
      stroke-width: 1.8;
    }

    .search-box input {
      width: 100%;
      min-width: 0;
      color: white;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 13px;
    }

    .search-box input::placeholder {
      color: #888ba4;
    }

    /* SECTION */

    .section-heading {
      margin: 34px 0 17px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
    }

    .section-title {
      font-size: 21px;
      font-weight: 900;
    }

    .section-subtitle {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
    }

    .games-count {
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      white-space: nowrap;
    }

    /* GAME GRID */

    .games-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 19px;
    }

    .game-card {
      min-width: 0;
      overflow: hidden;
      position: relative;
      background: linear-gradient(155deg, rgba(31,35,60,.97), rgba(15,19,36,.98));
      border: 1px solid rgba(255,255,255,.09);
      border-radius: 21px;
      box-shadow: 0 15px 38px rgba(0,0,0,.24);
      transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }

    .game-card:hover {
      transform: translateY(-5px);
      border-color: rgba(176,151,255,.42);
      box-shadow: 0 22px 45px rgba(0,0,0,.36);
    }

    .game-cover {
      position: relative;
      height: 205px;
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(107,80,181,.3), rgba(14,20,40,.9));
    }

    .game-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .5s ease;
    }

    .game-card:hover .game-cover img {
      transform: scale(1.055);
    }

    .game-cover::after {
      content: "";
      position: absolute;
      inset: 35% 0 0;
      background: linear-gradient(transparent, rgba(10,12,25,.78));
      pointer-events: none;
    }

    .cover-fallback {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 45%, rgba(159,128,255,.22), transparent 50%),
        linear-gradient(145deg, #282447, #11172c);
    }

    .cover-fallback svg {
      width: 66px;
      height: 66px;
      stroke: rgba(207,194,255,.8);
      fill: none;
      stroke-width: 1.1;
    }

    .game-number {
      position: absolute;
      z-index: 2;
      top: 13px;
      right: 13px;
      min-width: 31px;
      height: 29px;
      padding: 0 8px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      color: white;
      font-size: 10px;
      font-weight: 900;
      background: rgba(8,10,22,.65);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(12px);
    }

    .game-info {
      padding: 17px;
    }

    .game-title {
      font-size: 16px;
      font-weight: 900;
      line-height: 1.7;
    }

    .game-description {
      min-height: 25px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.9;
      overflow-wrap: anywhere;
    }

    .game-footer {
      margin-top: 16px;
      padding-top: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 9px;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .game-status {
      display: flex;
      align-items: center;
      gap: 7px;
      color: #8fe2bd;
      font-size: 10px;
      font-weight: 800;
    }

    .game-status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #63d7a0;
      box-shadow: 0 0 9px rgba(99,215,160,.65);
    }

    .game-open {
      min-height: 36px;
      padding: 6px 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 10px;
      color: white;
      font-size: 11px;
      font-weight: 900;
      background: linear-gradient(120deg, #9277f1, #7050d2);
      box-shadow: 0 6px 18px rgba(111,79,212,.25);
    }

    .game-open svg {
      width: 14px;
      height: 14px;
      stroke: white;
      fill: none;
      stroke-width: 2;
    }

    /* EMPTY AND LOADING */

    .state-panel {
      grid-column: 1 / -1;
      min-height: 280px;
      padding: 35px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 23px;
      border: 1px solid rgba(255,255,255,.09);
      background:
        linear-gradient(145deg, rgba(28,31,54,.88), rgba(15,18,34,.92));
    }

    .state-icon {
      width: 75px;
      height: 75px;
      display: grid;
      place-items: center;
      border-radius: 23px;
      background: rgba(157,129,255,.11);
      border: 1px solid rgba(157,129,255,.22);
    }

    .state-icon svg {
      width: 37px;
      height: 37px;
      stroke: #c1b1ff;
      fill: none;
      stroke-width: 1.4;
    }

    .state-panel h3 {
      margin-top: 18px;
      font-size: 17px;
      font-weight: 900;
    }

    .state-panel p {
      max-width: 390px;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
      line-height: 2;
    }

    .retry-button {
      margin-top: 19px;
      min-height: 40px;
      padding: 7px 18px;
      border-radius: 11px;
      color: white;
      font-size: 11px;
      font-weight: 900;
      background: linear-gradient(120deg, #9277f1, #7050d2);
    }

    .skeleton {
      min-height: 320px;
      border-radius: 21px;
      border: 1px solid var(--line);
      background: linear-gradient(
        110deg,
        rgba(27,31,53,.85) 8%,
        rgba(48,48,75,.65) 18%,
        rgba(27,31,53,.85) 33%
      );
      background-size: 200% 100%;
      animation: shimmer 1.5s linear infinite;
    }

    @keyframes shimmer {
      to { background-position-x: -200%; }
    }

    /* FOOTER */

    .bottom-nav {
      position: fixed;
      z-index: 50;
      right: 50%;
      bottom: max(12px, env(safe-area-inset-bottom));
      transform: translateX(50%);
      width: min(calc(100% - 26px), 610px);
      min-height: 67px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-around;
      gap: 4px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 21px;
      background: rgba(13,16,32,.93);
      box-shadow: 0 15px 45px rgba(0,0,0,.5);
      backdrop-filter: blur(22px);
    }

    .nav-item {
      min-width: 0;
      flex: 1;
      min-height: 49px;
      padding: 5px 3px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border-radius: 13px;
      color: #9295ac;
      font-size: 9px;
      font-weight: 800;
      transition: .2s;
    }

    .nav-item svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
    }

    .nav-item.active {
      color: #c7b8ff;
      background: rgba(148,119,245,.14);
    }

    .nav-item.active svg {
      filter: drop-shadow(0 0 7px rgba(170,145,255,.5));
    }

    .toast {
      position: fixed;
      z-index: 100;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      max-width: calc(100% - 30px);
      padding: 11px 17px;
      border-radius: 12px;
      color: white;
      background: #27233e;
      border: 1px solid rgba(255,255,255,.13);
      box-shadow: var(--shadow);
      font-size: 12px;
      display: none;
    }

    .toast.show {
      display: block;
    }

    /* RESPONSIVE */

    @media (max-width: 1050px) {
      .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .hero-decoration {
        left: 4%;
        width: 150px;
        height: 150px;
      }
    }

    @media (max-width: 650px) {
      .app {
        padding: 0 13px;
      }

      .topbar {
        min-height: 70px;
      }

      .brand-icon {
        width: 40px;
        height: 40px;
        border-radius: 13px;
      }

      .brand-name {
        font-size: 13px;
      }

      .brand-sub {
        font-size: 8px;
      }

      .wallet {
        gap: 7px;
        padding: 6px 7px;
      }

      .wallet-unit {
        font-size: 10px;
      }

      .wallet-unit svg {
        width: 14px;
        height: 14px;
      }

      .wallet-add {
        width: 25px;
        height: 25px;
      }

      .profile-link {
        width: 38px;
        height: 38px;
      }

      .hero {
        min-height: 280px;
        margin-top: 16px;
        padding: 25px 20px;
        border-radius: 23px;
        background-position: 58% center;
      }

      .hero-content {
        position: relative;
        z-index: 2;
        max-width: 85%;
      }

      .hero h1 {
        font-size: 32px;
      }

      .hero p {
        font-size: 11px;
      }

      .hero-decoration {
        width: 95px;
        height: 95px;
        left: -17px;
        opacity: .65;
      }

      .hero-decoration svg {
        width: 45px;
        height: 45px;
      }

      .games-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
      }

      .game-cover {
        height: 135px;
      }

      .game-info {
        padding: 12px;
      }

      .game-title {
        font-size: 13px;
      }

      .game-description {
        font-size: 10px;
      }

      .game-footer {
        align-items: flex-start;
        flex-direction: column;
        gap: 9px;
      }

      .game-open {
        width: 100%;
      }

      .section-title {
        font-size: 18px;
      }
    }

    @media (max-width: 360px) {
      .brand-sub {
        letter-spacing: 1px;
      }

      .header-actions {
        gap: 5px;
      }

      .wallet {
        gap: 5px;
      }

      .games-grid {
        gap: 8px;
      }

      .game-cover {
        height: 115px;
      }

      .game-info {
        padding: 9px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <div class="app">

    <header class="topbar">

      <a class="brand" href="home.html">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M7 8h10a4 4 0 0 1 4 4v4a3 3 0 0 1-5 2l-2-2h-4l-2 2a3 3 0 0 1-5-2v-4a4 4 0 0 1 4-4Z"/>
            <path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/>
          </svg>
        </span>

        <span>
          <span class="brand-name">HANOON WORLD</span>
          <span class="brand-sub">GAMES EXPERIENCE</span>
        </span>
      </a>

      <div class="header-actions">

        <div class="wallet">

          <div class="wallet-unit">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v10M15 9.5c-.5-1-1.5-1.5-3-1.5-1.4 0-2.5.7-2.5 1.7 0 3 5.5 1.2 5.5 4.2 0 1.1-1.1 2.1-3 2.1-1.4 0-2.5-.5-3.2-1.5"/>
            </svg>
            <span id="coinBalance">—</span>
          </div>

          <div class="wallet-unit gems">
            <svg viewBox="0 0 24 24">
              <path d="m12 2 9 7-9 13L3 9l9-7Z"/>
              <path d="m3 9 18 0M8 9l4 13 4-13M8 9l4-7 4 7"/>
            </svg>
            <span id="gemBalance">—</span>
          </div>

          <a class="wallet-add" href="wallet.html" aria-label="إضافة رصيد">
            <svg viewBox="0 0 24 24">
              <path d="M12 5v14M5 12h14"/>
            </svg>
          </a>

        </div>

        <a class="profile-link" id="myProfileLink" href="profile.html" aria-label="حسابي">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3.5"/>
            <path d="M4.5 21c.5-4 3.2-6 7.5-6s7 2 7.5 6"/>
          </svg>
        </a>

      </div>
    </header>

    <main>

      <section class="hero">
        <div class="hero-content">
          <span class="hero-label">
            <span></span>
            عالم المنافسة والتحدي
          </span>

          <h1>
            اكتشف عالم<br>
            <strong>الألعاب</strong>
          </h1>

          <p>
            استكشف الألعاب المتاحة في هنون، واختر تجربتك القادمة.
            كل لعبة تظهر هنا من قائمة الألعاب المعتمدة في المنصة.
          </p>
        </div>

        <div class="hero-decoration">
          <svg viewBox="0 0 24 24">
            <path d="M7 8h10a4 4 0 0 1 4 4v4a3 3 0 0 1-5 2l-2-2h-4l-2 2a3 3 0 0 1-5-2v-4a4 4 0 0 1 4-4Z"/>
            <path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/>
          </svg>
        </div>
      </section>

      <section class="search-section">
        <label class="search-box">
          <svg viewBox="0 0 24 24">
            <circle cx="10.8" cy="10.8" r="7"/>
            <path d="m16 16 5 5"/>
          </svg>
          <input
            id="gameSearch"
            type="search"
            placeholder="ابحث عن لعبة..."
            autocomplete="off"
          >
        </label>
      </section>

      <section>
        <div class="section-heading">
          <div>
            <h2 class="section-title">مكتبة الألعاب</h2>
            <span class="section-subtitle">الألعاب المفعّلة والمتاحة في المنصة</span>
          </div>

          <span class="games-count" id="gamesCount">جارٍ التحميل</span>
        </div>

        <div class="games-grid" id="gamesGrid">
          <div class="skeleton"></div>
          <div class="skeleton"></div>
          <div class="skeleton"></div>
        </div>
      </section>

    </main>

  </div>

  <nav class="bottom-nav">

    <a class="nav-item" href="home.html">
      <svg viewBox="0 0 24 24">
        <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-6v-7h-4v7H4a1 1 0 0 1-1-1V10Z"/>
      </svg>
      <span>الرئيسية</span>
    </a>

    <a class="nav-item" href="rooms.html">
      <svg viewBox="0 0 24 24">
        <path d="M3 20V9l9-6 9 6v11h-6v-7H9v7H3Z"/>

      <span>الغرف</span>
    </a>

    <a class="nav-item active" href="games.html">
      <svg viewBox="0 0 24 24">
        <path d="M7 8h10a4 4 0 0 1 4 4v4a3 3 0 0 1-5 2l-2-2h-4l-2 2a3 3 0 0 1-5-2v-4a4 4 0 0 1 4-4Z"/>
        <path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/>

      <span>الألعاب</span>
    </a>

    <a class="nav-item" href="chat.html">
      <svg viewBox="0 0 24 24">

        <path d="M8 9h8M8 13h5"/>
      </svg>
      <span>المحادثات</span>
    </a>

    <a class="nav-item" href="profile.html">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="3.5"/>
        <path d="M4.5 21c.5-4 3.2-6 7.5-6s7 2 7.5 6"/>
      </svg>
      <span>حسابي</span>
    </a>

  </nav>

  <div class="toast" id="toast"></div>

  <script>
    const SUPABASE_URL = "https://gjtgvczvclfwvlvcquxh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4DVTUZ-xTlqU2GpFvpb7lw_g-Kxomd4";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const state = {
      user: null,
      games: [],
      filteredGames: []
    };

    const $ = id => document.getElementById(id);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function isURL(value) {
      return /^https?:\/\//i.test(String(value || ""));
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.classList.add("show");

      clearTimeout(showToast.timer);

      showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
      }, 2800);
    }

    async function loadSession() {
      const { data, error } = await db.auth.getSession();

      if (error) throw error;

      state.user = data.session?.user || null;

      if (!state.user) {
        location.replace("index.html");
        return false;
      }

      return true;
    }

    async function loadProfile() {
      const { data, error } = await db
        .from("profiles")
        .select("id, avatar_path")
        .eq("id", state.user.id)
        .maybeSingle();

      if (error) throw error;

      if (!data?.avatar_path) return;

      const { data: imageData } = db.storage
        .from("avatars")
        .getPublicUrl(data.avatar_path);

      const imageURL = imageData?.publicUrl;

      if (imageURL) {
        $("myProfileLink").innerHTML = `
          <img src="${esc(imageURL)}" alt="حسابي">
        `;
      }
    }

    async function loadWallet() {
      const { data, error } = await db
        .from("world_wallets")
        .select("coins,gems")
        .eq("user_id", state.user.id)
        .maybeSingle();

      if (error) throw error;

      $("coinBalance").textContent =
        data?.coins == null
          ? "—"
          : Number(data.coins).toLocaleString("en-US");

      $("gemBalance").textContent =
        data?.gems == null
          ? "—"
          : Number(data.gems).toLocaleString("en-US");
    }

    function renderEmpty(title, description) {
      $("gamesGrid").innerHTML = `
        <div class="state-panel">
          <div class="state-icon">
            <svg viewBox="0 0 24 24">
              <path d="M7 8h10a4 4 0 0 1 4 4v4a3 3 0 0 1-5 2l-2-2h-4l-2 2a3 3 0 0 1-5-2v-4a4 4 0 0 1 4-4Z"/>
              <path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/>
            </svg>
          </div>

          <h3>${esc(title)}</h3>
          <p>${esc(description)}</p>

          <button class="retry-button" id="retryGames">
            إعادة المحاولة
          </button>
        </div>
      `;

      $("retryGames").addEventListener("click", loadGames);
    }

    function renderGames(games) {
      const grid = $("gamesGrid");

      $("gamesCount").textContent =
        `${games.length.toLocaleString("ar-EG")} لعبة`;

      if (!games.length) {
        if (state.games.length) {
          renderEmpty(
            "لا توجد نتائج مطابقة",
            "جرّب البحث باسم مختلف."
          );
        } else {
          renderEmpty(
            "لا توجد ألعاب مفعّلة حاليًا",
            "ستظهر الألعاب هنا بمجرد إضافتها وتفعيلها في قاعدة بيانات المنصة."
          );
        }

        return;
      }

      grid.innerHTML = games.map((game, index) => {
        const title =
          game.title_ar ||
          game.title_en ||
          "لعبة";

        const description =
          game.description_ar ||
          game.description ||
          game.title_en ||
          "";

        const cover = isURL(game.cover_path)
          ? game.cover_path
          : "";

        const gameKey = encodeURIComponent(
          game.slug || game.id
        );

        return `
          <article class="game-card">

            <div class="game-cover">

              ${
                cover
                  ? `
                    <img
                      src="${esc(cover)}"
                      alt="${esc(title)}"
                      loading="lazy"
                      onerror="this.style.display='none'"
                    >
                  `
                  : `
                    <div class="cover-fallback">
                      <svg viewBox="0 0 24 24">
                        <path d="M7 8h10a4 4 0 0 1 4 4v4a3 3 0 0 1-5 2l-2-2h-4l-2 2a3 3 0 0 1-5-2v-4a4 4 0 0 1 4-4Z"/>
                        <path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/>
                      </svg>
                    </div>
                  `
              }

              <span class="game-number">
                ${String(index + 1).padStart(2, "0")}
              </span>

            </div>

            <div class="game-info">

              <h3 class="game-title">
                ${esc(title)}
              </h3>

              <p class="game-description">
                ${esc(description)}
              </p>

              <div class="game-footer">

                <span class="game-status">
                  متاحة
                </span>

                <a
                  class="game-open"
                  href="game.html?game=${gameKey}"
                >
                  التفاصيل

                  <svg viewBox="0 0 24 24">
                    <path d="m9 18 6-6-6-6"/>
                  </svg>
                </a>

              </div>

            </div>
          </article>
        `;
      }).join("");
    }

    async function loadGames() {
      const grid = $("gamesGrid");

      grid.innerHTML = `
        <div class="skeleton"></div>
        <div class="skeleton"></div>
        <div class="skeleton"></div>
      `;

      try {
        const { data, error } = await db
          .from("world_games_catalog")
          .select("*")
          .eq("is_active", true)
          .order("title_ar", { ascending: true });

        if (error) throw error;

        state.games = data || [];
        state.filteredGames = [...state.games];

        renderGames(state.filteredGames);

      } catch (error) {
        console.error("HANOON games:", error);

        $("gamesCount").textContent = "تعذر التحميل";

        renderEmpty(
          "تعذر تحميل الألعاب",
          "حدث خطأ أثناء الاتصال بقاعدة البيانات. يمكنك المحاولة مرة أخرى."
        );
      }
    }

    function setupSearch() {
      $("gameSearch").addEventListener("input", event => {
        const query = event.target.value
          .trim()
          .toLocaleLowerCase();

        state.filteredGames = state.games.filter(game => {
          const title = [
            game.title_ar,
            game.title_en,
            game.name,
            game.slug
          ].filter(Boolean).join(" ").toLocaleLowerCase();

          return title.includes(query);
        });

        renderGames(state.filteredGames);
      });
    }

    async function startPage() {
      try {
        const valid = await loadSession();

        if (!valid) return;

        await Promise.allSettled([
          loadProfile(),
          loadWallet()
        ]);

        await loadGames();

      } catch (error) {
        console.error("HANOON games startup:", error);

        renderEmpty(
          "تعذر فتح الصفحة",
          "حدث خطأ أثناء تجهيز حسابك. أعد تحميل الصفحة."
        );
      }
    }

    setupSearch();

    db.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT" || !session) {
        location.replace("index.html");
      }
    });

    startPage();
  </script>
