<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#080a16">
<title>مكتبة الألعاب | HANOON WORLD</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#080a16;
  --panel:#111629;
  --purple:#a58aff;
  --gold:#edca83;
  --cyan:#70d9d2;
  --text:#f8f6ff;
  --muted:#a6abc2;
  --line:rgba(255,255,255,.09);
  --green:#65d6a1;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  overflow-x:hidden;
  padding-bottom:110px;
  background:var(--bg);
  color:var(--text);
  font-family:"Cairo",sans-serif;
}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.page-background{
  position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(ellipse at 10% 12%,rgba(115,81,210,.22),transparent 35%),
    radial-gradient(ellipse at 90% 45%,rgba(37,139,151,.13),transparent 35%),
    radial-gradient(ellipse at 50% 100%,rgba(117,76,190,.13),transparent 40%),
    #080a16;
}
.page-background:before,.page-background:after{
  content:"";position:absolute;width:360px;height:360px;
  border:1px solid rgba(177,151,255,.07);border-radius:50%;
}
.page-background:before{
  top:180px;right:-250px;
  box-shadow:0 0 0 35px rgba(177,151,255,.018),0 0 0 75px rgba(177,151,255,.012);
}
.page-background:after{
  bottom:100px;left:-260px;
  box-shadow:0 0 0 35px rgba(104,217,213,.018),0 0 0 75px rgba(104,217,213,.012);
}
.app{width:min(100%,1500px);margin:auto;padding:0 25px}

/* HEADER */
.topbar{
  min-height:82px;display:flex;align-items:center;
  justify-content:space-between;gap:14px;
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:12px}
.brand-icon{
  width:46px;height:46px;display:grid;place-items:center;
  border:1px solid #c2adff55;border-radius:15px;
  background:linear-gradient(145deg,#b49aff,#6845ce);
  box-shadow:0 8px 28px #7954d455;
}
.brand-icon svg{width:26px;height:26px;color:white}
.brand-name{display:block;font-size:15px;font-weight:900}
.brand-sub{display:block;margin-top:-5px;color:var(--gold);font-size:9px;letter-spacing:2px}
.header-actions{display:flex;align-items:center;gap:10px}
.wallet{
  display:flex;align-items:center;gap:11px;padding:7px 9px;
  border:1px solid var(--line);border-radius:14px;
  background:#151a2de8;backdrop-filter:blur(15px);
}
.wallet-unit{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:900}
.wallet-unit svg{width:17px;height:17px;color:var(--gold)}
.wallet-unit.gems svg{color:var(--cyan)}
.wallet-add{
  width:30px;height:30px;display:grid;place-items:center;
  border-radius:9px;background:linear-gradient(145deg,#aa91ff,#704ed4);
}
.wallet-add svg{width:17px;height:17px;color:white;stroke-width:2.4}
.profile-link{
  width:43px;height:43px;overflow:hidden;display:grid;place-items:center;
  border:2px solid var(--purple);border-radius:50%;background:#24243d;
}
.profile-link img{width:100%;height:100%;object-fit:cover}
.profile-link svg{width:22px;height:22px;color:#cbbdff}

/* HERO */
.hero{
  position:relative;min-height:330px;margin-top:24px;padding:40px;
  display:flex;align-items:center;overflow:hidden;isolation:isolate;
  border:1px solid #bba4ff38;border-radius:28px;
  background:
    linear-gradient(90deg,rgba(7,9,23,.97),rgba(10,12,29,.75),rgba(10,12,29,.25)),
    url("https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1900&q=90")
    center/cover no-repeat;
  box-shadow:0 22px 65px #0007;
}
.hero:after{
  content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(circle at 75% 45%,rgba(160,125,255,.25),transparent 35%);
}
.hero-content{position:relative;z-index:2;max-width:620px}
.hero-label{
  display:inline-flex;align-items:center;gap:9px;padding:7px 14px;
  border:1px solid #edca8350;border-radius:30px;
  background:#edca8314;color:var(--gold);font-size:11px;font-weight:900;
}
.hero-label span{
  width:7px;height:7px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 12px var(--gold);
}
.hero h1{margin-top:17px;font-size:clamp(34px,5vw,55px);line-height:1.35;font-weight:900}
.hero h1 strong{color:#c2adff;text-shadow:0 5px 30px #9b7bff55}
.hero p{max-width:480px;margin-top:12px;color:#d0cce0;font-size:13px;line-height:2.1}
.hero-art{
  position:absolute;left:8%;top:50%;transform:translateY(-50%);
  width:190px;height:190px;display:grid;place-items:center;
  border:1px solid #ffffff24;border-radius:50%;
  background:#ffffff09;box-shadow:0 0 90px #9170ff28;
}
.hero-art:before,.hero-art:after{
  content:"";position:absolute;border:1px solid #beabff30;border-radius:50%;
}
.hero-art:before{inset:14px}
.hero-art:after{inset:29px}
.hero-art svg{width:75px;height:75px;color:#c8b8ff;stroke-width:1.2}

/* SEARCH */
.search-area{margin-top:26px}
.search-box{
  min-height:58px;display:flex;align-items:center;gap:13px;
  padding:0 18px;border:1px solid #ae97ff38;border-radius:16px;
  background:#15192bef;box-shadow:0 10px 30px #0002;
}
.search-box svg{width:22px;height:22px;flex:none;color:#bbaaff}
.search-box input{
  width:100%;min-width:0;border:0;outline:0;
  background:transparent;color:white;font-size:13px;
}
.search-box input::placeholder{color:#888ba4}

/* FILTERS */
.filters{
  display:flex;align-items:center;gap:9px;
  margin-top:17px;overflow-x:auto;padding-bottom:5px;scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.filter-btn{
  flex:none;padding:9px 18px;border:1px solid #ffffff18;
  border-radius:30px;background:#171a30d9;color:#b9bad0;
  font-size:11px;font-weight:800;transition:none;
}
.filter-btn.active{
  border-color:#a18aff80;background:#a18aff24;color:#d6caff;
}

/* SECTION */
.section-heading{
  margin:29px 0 18px;display:flex;
  align-items:flex-end;justify-content:space-between;gap:12px;
}
.section-title{font-size:22px;font-weight:900}
.section-subtitle{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.games-count{color:var(--gold);font-size:11px;font-weight:900;white-space:nowrap}

/* GAME CARDS */
.games-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(min(100%,255px),1fr));
  gap:20px;
}
.game-card{
  --game-glow:rgba(145,112,255,.25);
  --game-color:#a58aff;
  min-width:0;overflow:hidden;position:relative;display:block;
  border:1px solid #ffffff18;border-radius:22px;
  background:linear-gradient(155deg,#202641,#101528 80%);
  box-shadow:0 16px 38px #0005;
  transition:none!important;
  transform:none!important;
}
.game-card.is-ready{cursor:pointer}
.game-card.is-ready:hover{
  transform:none!important;
  border-color:#ffffff30;
  box-shadow:0 16px 38px #0005;
}
.game-card.is-coming{
  cursor:not-allowed;
  pointer-events:none!important;
  opacity:.9;
}
.game-cover{
  position:relative;height:220px;overflow:hidden;isolation:isolate;
  background:
    radial-gradient(circle at 50% 40%,var(--game-glow),transparent 65%),
    linear-gradient(140deg,#222b49,#11172a);
}
.game-cover:before{
  content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(4,7,18,.02) 5%,transparent 30%,rgba(4,7,18,.9) 100%);
  pointer-events:none;
}
.game-cover img{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;object-fit:cover;
  transform:none!important;
  transition:none!important;
}
.game-art{
  position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;
  background:
    radial-gradient(circle at 50% 40%,var(--game-glow),transparent 65%),
    linear-gradient(145deg,#242b49,#101528);
}
.game-art:before,.game-art:after{
  content:"";position:absolute;
  border:1px solid color-mix(in srgb,var(--game-color) 35%,transparent);
  border-radius:50%;width:190px;height:190px;
}
.game-art:after{width:135px;height:135px}
.game-art svg{width:82px;height:82px;color:var(--game-color);stroke-width:1.2;z-index:1}
.game-number{
  position:absolute;z-index:3;top:12px;right:12px;
  min-width:33px;height:31px;padding:0 8px;
  display:grid;place-items:center;border:1px solid #ffffff35;
  border-radius:9px;background:#080a16c9;color:white;font-size:10px;font-weight:900;
}
.game-category{
  position:absolute;z-index:3;bottom:13px;right:14px;
  padding:5px 11px;border:1px solid #ffffff2b;border-radius:20px;
  background:#090b18c9;color:#e8deff;font-size:9px;font-weight:800;
}
.game-info{position:relative;padding:16px}
.game-title{font-size:16px;font-weight:900;line-height:1.7}
.game-description{min-height:43px;margin-top:5px;color:var(--muted);font-size:10px;line-height:1.9}
.coming-note{
  margin-top:8px;padding:9px 10px;
  border:1px solid #edca8330;border-radius:10px;
  background:#edca830d;color:#e8d2a5;font-size:10px;line-height:1.9;
}
.game-footer{
  margin-top:14px;padding-top:12px;display:flex;
  align-items:center;justify-content:space-between;gap:10px;
  border-top:1px solid #ffffff12;
}
.game-status{display:flex;align-items:center;gap:7px;color:var(--gold);font-size:10px;font-weight:900}
.game-status:before{
  content:"";width:7px;height:7px;border-radius:50%;
  background:var(--gold);box-shadow:0 0 9px #edca8380;
}
.game-status.ready{color:var(--green)}
.game-status.ready:before{background:var(--green);box-shadow:0 0 9px #65d6a180}
.game-action{
  min-height:38px;padding:7px 15px;display:inline-flex;
  align-items:center;justify-content:center;gap:7px;
  border-radius:10px;font-size:10px;font-weight:900;
}
.game-action.play{
  background:linear-gradient(120deg,#9277f1,#7050d2);
  color:white;box-shadow:0 6px 17px #7954d455;
}
.game-action svg{width:14px;height:14px}
.game-action.coming{
  border:1px solid #edca8340;background:#edca8312;color:var(--gold);
}

/* EMPTY / LOADING */
.state-panel{
  grid-column:1/-1;min-height:270px;padding:30px 20px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;border:1px solid var(--line);border-radius:22px;
  background:#171a30ef;
}
.state-panel h3{margin-top:15px;font-size:17px}
.state-panel p{max-width:390px;margin-top:7px;color:var(--muted);font-size:12px;line-height:2}
.state-icon{
  width:70px;height:70px;display:grid;place-items:center;
  border:1px solid #9d81ff40;border-radius:21px;background:#9d81ff19;
}
.state-icon svg{width:35px;height:35px;color:#c1b1ff}
.retry-button{
  margin-top:18px;padding:9px 18px;border:0;border-radius:10px;
  background:linear-gradient(120deg,#9277f1,#7050d2);
  color:white;font-size:11px;font-weight:900;
}
.skeleton{
  min-height:310px;border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(145deg,#242a43,#151a2d);
}

/* NAV */
.bottom-nav{
  position:fixed;z-index:50;right:50%;
  bottom:max(12px,env(safe-area-inset-bottom));
  transform:translateX(50%);
  width:min(calc(100% - 26px),610px);min-height:67px;
  padding:8px 10px;display:flex;align-items:center;justify-content:space-around;gap:4px;
  border:1px solid #ffffff20;border-radius:21px;
  background:#0d1020ed;box-shadow:0 15px 45px #0008;backdrop-filter:blur(22px);
}
.nav-item{
  min-width:0;flex:1;min-height:49px;padding:5px 3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  border-radius:13px;color:#9295ac;font-size:9px;font-weight:800;
}
.nav-item svg{width:21px;height:21px}
.nav-item.active{color:#c7b8ff;background:#9477f524}

/* RESPONSIVE */
@media(max-width:650px){
  .app{padding:0 13px}
  .topbar{min-height:69px}
  .brand-icon{width:39px;height:39px}
  .brand-name{font-size:12px}
  .brand-sub{font-size:7px;letter-spacing:1.5px}
  .header-actions{gap:5px}
  .wallet{gap:6px;padding:6px}
  .wallet-unit{font-size:9px}
  .wallet-unit svg{width:14px;height:14px}
  .wallet-add{width:24px;height:24px}
  .profile-link{width:36px;height:36px}
  .hero{min-height:270px;margin-top:15px;padding:22px 18px;border-radius:22px;background-position:58% center}
  .hero-content{max-width:92%}
  .hero h1{font-size:32px}
  .hero p{font-size:10px}
  .hero-art{left:-20px;width:105px;height:105px;opacity:.65}
  .hero-art svg{width:43px;height:43px}
  .games-grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,155px),1fr));gap:11px}
  .game-cover{height:150px}
  .game-info{padding:11px}
  .game-title{font-size:12px}
  .game-description{font-size:9px;min-height:48px}
  .coming-note{font-size:9px}
  .game-footer{align-items:flex-start;flex-direction:column}
  .game-action{width:100%}
  .section-title{font-size:18px}
}
@media(max-width:360px){
  .wallet{gap:4px}
  .games-grid{gap:8px}
  .game-cover{height:125px}
  .game-info{padding:9px}
}
</style>
</head>

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g,char=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[char]);
}

function getTheme(slug){
  return GAME_THEMES[slug] || ["#a58aff","rgba(145,112,255,.25)"];
}

function getCover(game){
  if(game.cover_path && /^https?:\/\//i.test(game.cover_path)){
    return game.cover_path;
  }
  return GAME_COVERS[game.slug] || null;
}

function artMarkup(slug){
  const symbol = GAME_SYMBOLS[slug] || '<rect x="4" y="4" width="16" height="16" rx="4"/>';
  return `<div class="game-art"><svg viewBox="0 0 24 24">${symbol}</svg></div>`;
}

async function loadSession(){
  const {data,error} = await db.auth.getSession();
  if(error) throw error;

  state.user = data.session?.user || null;

  if(!state.user){
    location.replace("index.html");
    return false;
  }
  return true;
}

async function loadProfile(){
  const {data,error} = await db
    .from("profiles")
    .select("id,avatar_path")
    .eq("id",state.user.id)
    .maybeSingle();

  if(error) throw error;
  if(!data?.avatar_path) return;

  const {data:imageData} = db.storage.from("avatars").getPublicUrl(data.avatar_path);
  if(imageData?.publicUrl){
    $("myProfileLink").innerHTML =
      `<img src="${esc(imageData.publicUrl)}" alt="حسابي">`;
  }
}

async function loadWallet(){
  const {data,error} = await db
    .from("world_wallets")
    .select("coins,gems")
    .eq("user_id",state.user.id)
    .maybeSingle();

  if(error) throw error;

  $("coinBalance").textContent =
    data?.coins == null ? "—" : Number(data.coins).toLocaleString("en-US");

  $("gemBalance").textContent =
    data?.gems == null ? "—" : Number(data.gems).toLocaleString("en-US");
}

function showEmpty(title,description,retry=false){
  $("gamesGrid").innerHTML = `
    <div class="state-panel">
      <div class="state-icon">
        <svg viewBox="0 0 24 24">
          <path d="M7 8h10a4 4 0 0 1 4 4v4a3 3 0 0 1-5 2l-2-2h-4l-2 2a3 3 0 0 1-5-2v-4a4 4 0 0 1 4-4Z"/>
          <path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/>
        </svg>
      </div>
      <h3>${esc(title)}</h3>
      <p>${esc(description)}</p>
      ${retry ? '<button class="retry-button" id="retryGames">إعادة المحاولة</button>' : ""}
    </div>
  `;

  if(retry) $("retryGames").addEventListener("click",loadGames);
}

function getFilteredGames(){
  return state.games.filter(game=>{
    const ready = game.is_active === true;

    if(state.filter === "ready" && !ready) return false;
    if(state.filter === "coming" && ready) return false;

    if(state.query){
      const words = [
        game.title_ar,game.title_en,game.slug,
        game.description_ar,game.description_en
      ].filter(Boolean).join(" ").toLocaleLowerCase();

      if(!words.includes(state.query)) return false;
    }
    return true;
  });
}

function renderGames(){
  const games = getFilteredGames();

  $("gamesCount").textContent =
    `${games.length.toLocaleString("ar-EG")} لعبة`;

  if(!games.length){
    showEmpty("لا توجد نتائج مطابقة","لم نعثر على لعبة بهذا الاسم ضمن الاختيار الحالي.");
    return;
  }

  $("gamesGrid").innerHTML = games.map((game,index)=>{
    const title = game.title_ar || game.title_en || "لعبة";
    const description =
      game.description_ar || game.description_en || "اكتشف هذه اللعبة من مكتبة هنون.";
    const category = CATEGORY_NAMES[game.category] || "ألعاب متنوعة";
    const ready = game.is_active === true;
    const cover = getCover(game);
    const theme = getTheme(game.slug);
    const target = `game.html?game=${encodeURIComponent(game.slug || game.id)}`;

    const coverMarkup = cover
      ? `<img src="${esc(cover)}" alt="${esc(title)}" loading="lazy" onerror="this.remove()">`
      : "";

    const cardContent = `
      <div class="game-cover">
        ${artMarkup(game.slug)}
        ${coverMarkup}
        <span class="game-number">${String(index+1).padStart(2,"0")}</span>
        <span class="game-category">${esc(category)}</span>
      </div>

      <div class="game-info">
        <h3 class="game-title">${esc(title)}</h3>
        <p class="game-description">${esc(description)}</p>

        ${ready ? "" : `
          <p class="coming-note">
            لسه بنحضّرها ليك… استنّى تجربة حلوة قريبًا.
          </p>
        `}

        <div class="game-footer">
          <span class="game-status ${ready ? "ready" : ""}">
            ${ready ? "متاحة للعب" : "قيد التجهيز"}
          </span>

          <span class="game-action ${ready ? "play" : "coming"}">
            ${ready ? "العب الآن" : "قريبًا"}
            ${ready ? '<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>' : ""}
          </span>
        </div>
      </div>
    `;

    if(ready){
      return `
        <a class="game-card is-ready"
           href="${target}"
           style="--game-color:${theme[0]};--game-glow:${theme[1]}"
           aria-label="افتح لعبة ${esc(title)}">
          ${cardContent}
        </a>
      `;
    }

    return `
      <article class="game-card is-coming"
        aria-disabled="true"
        style="--game-color:${theme[0]};--game-glow:${theme[1]}">
        ${cardContent}
      </article>
    `;
  }).join("");
}

async function loadGames(){
  $("gamesGrid").innerHTML = `
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  `;

  try{
    const {data,error} = await db
      .from("world_games_catalog")
      .select("*")
      .order("sort_order",{ascending:true});

    if(error) throw error;

    state.games = data || [];

    if(!state.games.length){
      $("gamesCount").textContent = "0 لعبة";
      showEmpty("مكتبة الألعاب فارغة","لا توجد ألعاب مسجلة في قاعدة البيانات حاليًا.");
      return;
    }

    renderGames();
  }catch(error){
    console.error("HANOON games:",error);
    $("gamesCount").textContent = "تعذر التحميل";
    showEmpty("تعذر تحميل الألعاب","حدث خطأ أثناء الاتصال بقاعدة البيانات. حاول مرة أخرى.",true);
  }
}

function setupSearch(){
  $("gameSearch").addEventListener("input",event=>{
    state.query = event.target.value.trim().toLocaleLowerCase();
    renderGames();
  });
}

function setupFilters(){
  document.querySelectorAll(".filter-btn").forEach(button=>{
    button.addEventListener("click",()=>{
      document.querySelectorAll(".filter-btn")
        .forEach(item=>item.classList.remove("active"));

      button.classList.add("active");
      state.filter = button.dataset.filter;
      renderGames();
    });
  });
}

async function startPage(){
  try{
    const valid = await loadSession();
    if(!valid) return;

    await Promise.allSettled([loadProfile(),loadWallet()]);
    await loadGames();
  }catch(error){
    console.error("HANOON games startup:",error);
    showEmpty("تعذر فتح الصفحة","حدث خطأ أثناء تجهيز الصفحة. أعد تحميلها.");
  }
}

setupSearch();
setupFilters();

db.auth.onAuthStateChange((event,session)=>{
  if(event === "SIGNED_OUT" || !session){
    location.replace("index.html");
  }
});

startPage();
</script>
