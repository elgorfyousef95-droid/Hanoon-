
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101019">
  <title>HANOON WORLD — تسجيل الدخول</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * { box-sizing:border-box; }

    body {
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:20px;
      font-family:'Cairo',sans-serif;
      color:#f8f5ef;
      background:
        linear-gradient(rgba(12,12,20,.82),rgba(12,12,20,.94)),
        url("https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=2000&q=85")
        center/cover fixed;
    }

    .container {
      width:min(440px,100%);
    }

    .brand {
      text-align:center;
      margin-bottom:25px;
    }

    .logo {
      width:76px;
      height:76px;
      display:grid;
      place-items:center;
      margin:auto;
      border-radius:24px;
      color:#251b0d;
      font-size:36px;
      font-weight:900;
      background:linear-gradient(145deg,#f2d9a7,#b98b48);
      box-shadow:0 10px 35px rgba(217,183,121,.25);
    }

    .brand h1 {
      margin:12px 0 0;
      font-size:25px;
      font-weight:900;
      letter-spacing:2px;
    }

    .brand p {
      color:#aaa7b5;
      font-size:12px;
      margin:4px 0;
    }

    .card {
      padding:30px;
      border:1px solid rgba(255,255,255,.1);
      border-radius:24px;
      background:rgba(25,25,37,.94);
      backdrop-filter:blur(18px);
      box-shadow:0 20px 70px rgba(0,0,0,.35);
    }

    .card h2 {
      font-size:21px;
      margin:0 0 5px;
    }

    .description {
      color:#aaa7b5;
      font-size:12px;
      margin:0 0 25px;
    }

    label {
      display:block;
      font-size:12px;
      font-weight:700;
      margin:15px 0 8px;
    }

    input {
      width:100%;
      padding:14px;
      border-radius:12px;
      border:1px solid rgba(255,255,255,.1);
      background:#12121d;
      color:white;
      outline:none;
      font-family:inherit;
      font-size:14px;
    }

    input:focus {
      border-color:#d9b779;
      box-shadow:0 0 0 3px rgba(217,183,121,.08);
    }

    .password-wrap {
      position:relative;
    }

    .password-wrap input {
      padding-left:65px;
    }

    .show-password {
      position:absolute;
      left:10px;
      top:50%;
      transform:translateY(-50%);
      border:0;
      background:transparent;
      color:#d9b779;
      font-size:11px;
      font-family:inherit;
      cursor:pointer;
    }

    .submit {
      width:100%;
      margin-top:23px;
      padding:15px;
      border:0;
      border-radius:13px;
      background:linear-gradient(110deg,#b98b48,#f0d6a2);
      color:#21190e;
      font-family:inherit;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
    }

    .submit:disabled {
      opacity:.6;
      cursor:wait;
    }

    .message {
      display:none;
      padding:12px;
      margin-top:15px;
      border-radius:11px;
      font-size:12px;
      line-height:1.8;
    }

    .message.show { display:block; }

    .message.error {
      color:#ffc3cb;
      background:rgba(255,100,124,.1);
      border:1px solid rgba(255,100,124,.2);
    }

    .message.success {
      color:#baf5dc;
      background:rgba(86,214,164,.1);
      border:1px solid rgba(86,214,164,.2);
    }

    .register {
      text-align:center;
      color:#aaa7b5;
      font-size:12px;
      margin-top:22px;
    }

    .register a {
      color:#e7c78e;
      text-decoration:none;
      font-weight:800;
    }

    .footer {
      text-align:center;
      color:#777482;
      font-size:10px;
      margin-top:22px;
    }

    .loading-screen {
      position:fixed;
      inset:0;
      z-index:10;
      display:grid;
      place-items:center;
      background:#101019;
    }

    .loading-content { text-align:center; }

    .spinner {
      width:43px;
      height:43px;
      margin:0 auto 15px;
      border:3px solid rgba(217,183,121,.2);
      border-top-color:#e9c98f;
      border-radius:50%;
      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform:rotate(360deg); }
    }

    .loading-screen p {
      color:#d9c59f;
      font-size:12px;
    }

    @media(max-width:480px) {
      .card { padding:23px 19px; }
      .brand h1 { font-size:22px; }
    }
  </style>
</head>

<body>

  <div class="loading-screen" id="loadingScreen">
    <div class="loading-content">
      <div class="spinner"></div>
      <p id="loadingText">جارٍ التحقق من حسابك...</p>
    </div>
  </div>

  <main class="container" id="loginPage" hidden>

    <header class="brand">
      <div class="logo">H</div>
      <h1>HANOON WORLD</h1>
      <p>عالمك، أصدقاؤك، وتجربتك الخاصة</p>
    </header>

    <section class="card">
      <h2>مرحبًا بعودتك</h2>
      <p class="description">سجّل الدخول لمتابعة رحلتك في عالم هنون.</p>

      <form id="loginForm">
        <label for="username">اسم المستخدم</label>
        <input
          id="username"
          type="text"
          placeholder="اكتب اسم المستخدم"
          autocomplete="username"
          maxlength="24"
          required
        >

        <label for="password">كلمة المرور</label>
        <div class="password-wrap">
          <input
            id="password"
            type="password"
            placeholder="اكتب كلمة المرور"
            autocomplete="current-password"
            required
          >
          <button class="show-password" type="button" id="togglePassword">
            إظهار
          </button>
        </div>

        <button class="submit" id="loginButton" type="submit">
          تسجيل الدخول
        </button>
      </form>

      <div class="message" id="messageBox" role="status"></div>

      <div class="register">
        ليس لديك حساب؟
        <a href="register.html">إنشاء حساب جديد</a>
      </div>
    </section>

    <footer class="footer">
      HANOON WORLD · عالم يجمعنا
    </footer>

  </main>

  <script type="module">
    import { supabase } from "./supabase.js";
    import { signIn } from "./auth.js";

    const $ = id => document.getElementById(id);

    const loadingScreen = $("loadingScreen");
    const loginPage = $("loginPage");
    const loadingText = $("loadingText");

    function showMessage(message,type="error") {
      const box = $("messageBox");
      box.textContent = message;
      box.className = `message show ${type}`;
    }

    function showLogin() {
      loadingScreen.style.display = "none";
      loginPage.hidden = false;
    }

    async function redirectAccordingToProfile(userId) {
      loadingText.textContent = "جارٍ تجهيز عالمك...";

      const { data:profile,error } = await supabase
        .from("profiles")
        .select("profile_completed")
        .eq("id",userId)
        .maybeSingle();

      if (error) throw error;

      if (!profile || !profile.profile_completed) {
        window.location.replace("profile-setup.html");
        return;
      }

      window.location.replace("home.html");
    }

    async function restoreExistingSession() {
      const { data:sessionData,error:sessionError } =
        await supabase.auth.getSession();

      if (sessionError) throw sessionError;

      const session = sessionData?.session;

      if (!session) {
        showLogin();
        return;
      }

      loadingText.textContent = "جارٍ استعادة جلستك...";

      const { data:userData,error:userError } =
        await supabase.auth.getUser();

      if (userError || !userData?.user) {
        await supabase.auth.signOut();
        showLogin();
        return;
      }

      await redirectAccordingToProfile(userData.user.id);
    }

    $("togglePassword").addEventListener("click",() => {
      const input = $("password");
      const isPassword = input.type === "password";

      input.type = isPassword ? "text" : "password";
      $("togglePassword").textContent = isPassword ? "إخفاء" : "إظهار";
    });

    $("loginForm").addEventListener("submit",async event => {
      event.preventDefault();

      const username = $("username").value.trim().toLowerCase();
      const password = $("password").value;

      if (!/^[a-z0-9_]{3,24}$/.test(username)) {
        showMessage("اسم المستخدم يجب أن يكون من 3 إلى 24 حرفًا إنجليزيًا أو رقمًا أو شرطة سفلية.");
        return;
      }

      if (!password) {
        showMessage("اكتب كلمة المرور.");
        return;
      }

      const button = $("loginButton");
      button.disabled = true;
      button.textContent = "جارٍ تسجيل الدخول...";

      try {
        await signIn(username,password);

        showMessage("تم تسجيل الدخول بنجاح. جارٍ فتح حسابك...","success");

        const { data,error } = await supabase.auth.getUser();

        if (error || !data?.user) {
          throw new Error("تم تسجيل الدخول لكن تعذر استعادة بيانات الحساب.");
        }

        await redirectAccordingToProfile(data.user.id);

      } catch(error) {
        console.error("Login error:",error);

        showMessage(
          error.message || "تعذر تسجيل الدخول. تحقق من بياناتك وحاول مرة أخرى."
        );

        button.disabled = false;
        button.textContent = "تسجيل الدخول";
      }
    });

    try {
      await restoreExistingSession();
    } catch(error) {
      console.error("Session restore error:",error);
      showLogin();
      showMessage("تعذر التحقق من الجلسة الحالية. يمكنك تسجيل الدخول مرة أخرى.");
    }
  </script>

</body>
</html>
