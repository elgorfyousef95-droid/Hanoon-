
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d1c">
  <title>تسجيل الدخول | HANOON WORLD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --gold: #e8c77b;
      --gold-light: #ffe6a5;
      --purple: #8874ef;
      --text: #f8f5ff;
      --muted: #a7a7bb;
      --panel: rgba(12, 15, 32, .82);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      font-family: "Cairo", sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      color: var(--text);
      background: #080d1c;
      overflow-x: hidden;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        url("https://cdn.pixabay.com/photo/2019/04/16/20/01/architecture-4132660_1280.jpg")
        center center / cover no-repeat;
      transform: scale(1.025);
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg,
          rgba(5, 9, 24, .38),
          rgba(5, 9, 24, .78)),
        linear-gradient(0deg,
          rgba(5, 8, 22, .88),
          rgba(5, 8, 22, .28));
    }

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -2;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 75% 25%,
          rgba(115, 94, 224, .20),
          transparent 35%
        );
    }

    .page {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      grid-template-columns: 1.1fr .9fr;
      align-items: center;
      gap: 40px;
      padding: 55px 8%;
    }

    .intro {
      max-width: 620px;
      padding: 25px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 17px;
      margin-bottom: 35px;
    }

    .brand-mark {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      border-radius: 23px;
      background:
        linear-gradient(145deg, #f6df9f, #a77b39);
      box-shadow:
        0 10px 40px rgba(218, 176, 91, .25),
        inset 0 1px 1px rgba(255,255,255,.6);
    }

    .brand-mark svg {
      width: 42px;
      height: 42px;
    }

    .brand-name {
      font-size: 27px;
      font-weight: 900;
      letter-spacing: 2px;
      color: var(--gold-light);
    }

    .brand-caption {
      color: #c7c3d6;
      font-size: 12px;
      letter-spacing: 3px;
    }

    .intro h1 {
      font-size: clamp(34px, 5vw, 62px);
      line-height: 1.45;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .intro h1 span {
      color: var(--gold-light);
    }

    .intro p {
      max-width: 490px;
      color: #d2d0df;
      line-height: 2.1;
      font-size: 16px;
    }

    .intro-line {
      width: 85px;
      height: 3px;
      margin-top: 28px;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--gold), transparent);
    }

    .login-side {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    .login-card {
      width: min(100%, 440px);
      padding: 38px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: var(--panel);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow:
        0 30px 90px rgba(0,0,0,.38),
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .card-heading {
      margin-bottom: 28px;
    }

    .card-heading h2 {
      font-size: 27px;
      font-weight: 900;
      margin-bottom: 5px;
    }

    .card-heading p {
      color: var(--muted);
      font-size: 13px;
    }

    .field {
      margin-bottom: 19px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 9px;
      color: #e9e5f4;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      height: 56px;
      padding: 0 17px;
      border-radius: 14px;
      outline: none;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.055);
      color: white;
      font-family: inherit;
      font-size: 14px;
      transition: .25s;
    }

    .input-wrap input:focus {
      border-color: var(--gold);
      background: rgba(255,255,255,.085);
      box-shadow: 0 0 0 3px rgba(232,199,123,.10);
    }

    .input-wrap input::placeholder {
      color: #85869b;
    }

    .password-input {
      padding-left: 55px !important;
    }

    .toggle-password {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #b8b4c8;
      cursor: pointer;
      padding: 7px;
    }

    .toggle-password svg {
      width: 21px;
      height: 21px;
    }

    .login-button {
      width: 100%;
      height: 57px;
      margin-top: 9px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
      color: #211707;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      background: linear-gradient(110deg, #f4dfa5, #c99c50);
      box-shadow: 0 10px 28px rgba(199,154,75,.20);
      transition: .25s;
    }

    .login-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 34px rgba(199,154,75,.30);
    }

    .login-button:disabled {
      opacity: .65;
      cursor: wait;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 17px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.8;
    }

    .message.error {
      display: block;
      color: #ffb9c2;
      background: rgba(220, 55, 80, .13);
      border: 1px solid rgba(255, 100, 120, .2);
    }

    .message.success {
      display: block;
      color: #a9f4d4;
      background: rgba(45, 180, 125, .13);
      border: 1px solid rgba(70, 220, 160, .2);
    }

    .register-link {
      text-align: center;
      margin-top: 25px;
      color: var(--muted);
      font-size: 13px;
    }

    .register-link a {
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 800;
      margin-right: 4px;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .footer {
      position: fixed;
      bottom: 17px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: 11px;
      pointer-events: none;
    }

    @media (max-width: 850px) {
      .page {
        grid-template-columns: 1fr;
        gap: 22px;
        padding: 35px 20px 65px;
      }

      .intro {
        text-align: center;
        margin: auto;
        padding: 10px 0;
      }

      .brand {
        justify-content: center;
        margin-bottom: 16px;
      }

      .brand-mark {
        width: 54px;
        height: 54px;
        border-radius: 18px;
      }

      .brand-mark svg {
        width: 34px;
        height: 34px;
      }

      .brand-name {
        font-size: 21px;
      }

      .brand-caption {
        font-size: 10px;
      }

      .intro h1 {
        font-size: 28px;
        margin-bottom: 5px;
      }

      .intro p {
        font-size: 12px;
        line-height: 1.8;
        margin: auto;
      }

      .intro-line {
        margin: 15px auto 0;
      }

      .login-card {
        padding: 28px 23px;
        border-radius: 23px;
      }
    }

    @media (max-width: 380px) {
      .page {
        padding-left: 14px;
        padding-right: 14px;
      }

      .login-card {
        padding: 24px 18px;
      }

      .intro h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>
  <div class="ambient"></div>

  <main class="page">

    <section class="intro">

      <div class="brand">

        <div class="brand-mark">
          <svg viewBox="0 0 64 64" fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <path d="M32 5L39 18L54 21L44 32L46 47L32 40L18 47L20 32L10 21L25 18L32 5Z"
                  stroke="#38250D"
                  stroke-width="2.8"
                  stroke-linejoin="round"/>
            <circle cx="32" cy="28" r="6"
                    fill="#38250D"/>
            <path d="M19 53H45"
                  stroke="#38250D"
                  stroke-width="3"
                  stroke-linecap="round"/>
          </svg>
        </div>

        <div>
          <div class="brand-name">HANOON WORLD</div>
          <div class="brand-caption">CONNECT • PLAY • ENJOY</div>
        </div>

      </div>

      <h1>
        عالمك يبدأ<br>
        <span>من هنا</span>
      </h1>

      <p>
        ادخل عالم هنون، قابل أصدقاء جدد،
        شارك اللحظات الجميلة، واستمتع
        بالغرف والألعاب والتجارب المختلفة.
      </p>

      <div class="intro-line"></div>

    </section>

    <section class="login-side">

      <div class="login-card">

        <div class="card-heading">
          <h2>مرحبًا بعودتك</h2>
          <p>سجّل دخولك للمتابعة إلى عالم هنون</p>
        </div>

        <form id="loginForm">

          <div class="field">
            <label for="username">اسم المستخدم</label>

            <div class="input-wrap">
              <input
                id="username"
                name="username"
                type="text"
                placeholder="أدخل اسم المستخدم"
                autocomplete="username"
                minlength="3"
                maxlength="24"
                required
              >
            </div>
          </div>

          <div class="field">
            <label for="password">كلمة المرور</label>

            <div class="input-wrap">
              <input
                id="password"
                name="password"
                class="password-input"
                type="password"
                placeholder="أدخل كلمة المرور"
                autocomplete="current-password"
                required
              >

              <button
                class="toggle-password"
                id="togglePassword"
                type="button"
                aria-label="إظهار كلمة المرور"
              >
                <svg id="eyeIcon"
                     viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">
                  <path d="M2 12S5.5 5 12 5s10 7 10 7-3.5 7-10 7S2 12 2 12Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>

            </div>
          </div>

          <button
            class="login-button"
            id="loginButton"
            type="submit"
          >
            تسجيل الدخول
          </button>

          <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
          ></div>

        </form>

        <div class="register-link">
          ليس لديك حساب؟
          <a href="register.html">إنشاء حساب جديد</a>
        </div>

      </div>

    </section>

  </main>

  <div class="footer">
    © HANOON WORLD — جميع الحقوق محفوظة
  </div>

  <script type="module">
    import {
      signIn,
      restoreSession
    } from "./auth.js";

    const form = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginButton");
    const message = document.getElementById("message");
    const togglePassword = document.getElementById("togglePassword");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    function setLoading(loading) {
      loginButton.disabled = loading;
      loginButton.textContent = loading
        ? "جارٍ تسجيل الدخول..."
        : "تسجيل الدخول";
    }

    togglePassword.addEventListener("click", () => {
      const isPassword =
        passwordInput.type === "password";

      passwordInput.type =
        isPassword ? "text" : "password";

      togglePassword.setAttribute(
        "aria-label",
        isPassword
          ? "إخفاء كلمة المرور"
          : "إظهار كلمة المرور"
      );
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.className = "message";

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      setLoading(true);

      try {
        await signIn(username, password);

        showMessage(
          "تم تسجيل الدخول بنجاح. جارٍ فتح عالم هنون...",
          "success"
        );

        setTimeout(() => {
          window.location.href = "home.html";
        }, 700);

      } catch (error) {
        showMessage(
          error.message || "تعذر تسجيل الدخول.",
          "error"
        );

        setLoading(false);
      }
    });

    // استعادة الجلسة السابقة
    try {
      const account = await restoreSession();

      if (account) {
        window.location.replace("home.html");
      }
    } catch (error) {
      console.error("Session restore error:", error);
    }
  </script>

</body>
</html>
