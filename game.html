
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b18">
<title>HANOON WORLD | Game Arena</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
 --bg:#080a16;
 --panel:#14182b;
 --panel2:#1b2037;
 --line:rgba(255,255,255,.09);
 --text:#f7f5ff;
 --muted:#a5abc4;
 --purple:#a78bfa;
 --gold:#edca83;
 --cyan:#65d9d2;
 --green:#56d6a0;
 --red:#ff7188;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
 min-height:100vh;
 background:var(--bg);
 color:var(--text);
 font-family:Cairo,sans-serif;
 overflow-x:hidden;
}
button,input{font:inherit}
button{cursor:pointer;color:inherit}
a{color:inherit;text-decoration:none}
button:disabled{opacity:.45;cursor:not-allowed}

.bg{
 position:fixed;inset:0;z-index:-2;
 background:
 linear-gradient(180deg,rgba(6,8,19,.66),#080a16 88%),
 url("https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=2000&q=85") center/cover;
}
.bg:after{
 content:"";position:absolute;inset:0;
 background:
 radial-gradient(ellipse at 15% 10%,rgba(132,92,245,.2),transparent 38%),
 radial-gradient(ellipse at 90% 45%,rgba(38,184,190,.12),transparent 35%);
}
.container{width:min(1120px,calc(100% - 28px));margin:auto}

header{
 height:72px;display:flex;align-items:center;
 justify-content:space-between;border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:11px;font-weight:900}
.brand-icon{
 width:43px;height:43px;border-radius:15px;
 display:grid;place-items:center;
 background:linear-gradient(145deg,#b49aff,#6845ce);
 box-shadow:0 8px 28px #7955dc55;
}
.brand-icon svg{width:25px;stroke:white;fill:none;stroke-width:1.8}
.brand small{display:block;color:var(--gold);font-size:8px;letter-spacing:2px;margin-top:-5px}
.back{
 padding:9px 14px;border:1px solid var(--line);
 border-radius:12px;background:#ffffff0b;font-size:11px;font-weight:800;
}
.back svg{width:15px;vertical-align:middle;margin-left:5px;stroke:currentColor;fill:none;stroke-width:2}

.breadcrumb{display:flex;gap:9px;margin:20px 0;color:var(--muted);font-size:11px}
.breadcrumb a{color:#c1adff}

.hero{
 position:relative;min-height:275px;border:1px solid #b49aff33;
 border-radius:25px;overflow:hidden;background:#17172c;
 box-shadow:0 24px 70px #0007;
}
.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.48}
.hero-shade{
 position:absolute;inset:0;
 background:linear-gradient(90deg,#090b19 0%,#090b19dd 38%,#090b1966 100%);
}
.hero-content{position:relative;z-index:1;padding:38px;max-width:650px}
.eyebrow{
 display:inline-flex;padding:6px 12px;border:1px solid #edca8350;
 border-radius:30px;color:var(--gold);background:#edca8310;
 font-size:10px;font-weight:900;
}
h1{font-size:clamp(29px,5vw,48px);font-weight:900;margin:13px 0 6px}
.hero p{font-size:12px;line-height:2;color:#d0cce0;max-width:520px}
.hero-meta{display:flex;gap:9px;flex-wrap:wrap;margin-top:17px}
.pill{
 padding:7px 11px;border:1px solid var(--line);
 background:#080a1688;border-radius:10px;color:#e7e1ff;font-size:10px;
}

.section-title{
 display:flex;align-items:center;justify-content:space-between;
 margin:25px 0 13px;
}
.section-title h2{font-size:17px;font-weight:900}
.section-title span{font-size:10px;color:var(--muted)}

.layout{
 display:grid;grid-template-columns:minmax(0,1fr) 300px;
 gap:17px;align-items:start;margin-top:18px;
}
.panel{
 padding:20px;border:1px solid var(--line);border-radius:20px;
 background:linear-gradient(145deg,#171b30f2,#101426f2);
 box-shadow:0 15px 40px #0003;
 backdrop-filter:blur(14px);
}
.panel+.panel{margin-top:15px}
.panel h3{font-size:15px;font-weight:900;margin-bottom:13px}

.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}
.mode{
 min-height:112px;padding:15px;text-align:right;
 border:1px solid var(--line);border-radius:15px;background:#ffffff06;
 transition:border-color .2s,background .2s;
}
.mode:hover{border-color:#a78bfa88;background:#a78bfa12}
.mode.selected{border-color:var(--purple);background:#a78bfa18}
.mode svg{
 width:23px;height:23px;stroke:var(--purple);
 fill:none;stroke-width:1.7;margin-bottom:8px;
}
.mode b{display:block;font-size:12px}
.mode small{display:block;color:var(--muted);font-size:10px;margin-top:3px}

.notice{
 padding:13px;border:1px solid #edca8333;border-radius:13px;
 background:#edca830c;color:#d7d0e1;font-size:11px;line-height:2;
}
.notice strong{color:var(--gold)}

.primary{
 width:100%;min-height:47px;border:0;border-radius:13px;
 background:linear-gradient(120deg,#9c7cf4,#674bd0);
 font-size:12px;font-weight:900;
 box-shadow:0 9px 24px #7955dc30;
}
.secondary{
 width:100%;min-height:44px;border:1px solid var(--line);
 border-radius:12px;background:#ffffff08;font-size:11px;font-weight:800;
}

.game-area{margin-top:17px;display:none}
.game-area.show{display:block}
.game-top{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;margin-bottom:15px;
}
.game-top strong{font-size:14px}
.game-top span{font-size:10px;color:var(--muted)}

.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0 17px}
.level{
 min-height:43px;border:1px solid var(--line);
 border-radius:10px;background:#ffffff07;
 font-size:10px;font-weight:800;
}
.level.active{border-color:var(--purple);background:#a78bfa20;color:#d9caff}

.scoreboard{
 display:grid;grid-template-columns:1fr auto 1fr;
 gap:8px;align-items:center;margin-bottom:15px;
}
.player-score{
 padding:12px;border:1px solid var(--line);
 border-radius:13px;background:#ffffff07;text-align:center;
}
.player-score.active{border-color:#a78bfa99;background:#a78bfa15}
.player-score b{display:block;font-size:12px}
.player-score small{color:var(--muted);font-size:10px}
.vs{font-size:10px;color:var(--gold);font-weight:900}

.xo-board{
 width:min(100%,390px);margin:12px auto;
 display:grid;grid-template-columns:repeat(3,1fr);gap:9px;direction:ltr;
}
.xo-cell{
 aspect-ratio:1;border:1px solid #a78bfa35;
 border-radius:17px;background:linear-gradient(145deg,#202641,#11172b);
 font-size:clamp(35px,9vw,57px);font-weight:900;color:var(--purple);
 box-shadow:inset 0 0 20px #0003;
}
.xo-cell.o{color:var(--cyan)}
.xo-cell:disabled{cursor:default}
.xo-cell.winner{
 border-color:var(--gold);
 background:linear-gradient(145deg,#463c2b,#211c20);
 box-shadow:0 0 20px #edca8330;
}
.game-message{
 text-align:center;min-height:27px;margin:8px 0 14px;
 font-size:12px;font-weight:800;color:var(--gold);
}
.game-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}

.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{
 padding:12px 6px;text-align:center;
 border:1px solid var(--line);border-radius:12px;background:#ffffff06;
}
.stat b{display:block;font-size:18px;color:var(--gold)}
.stat small{font-size:9px;color:var(--muted)}

.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px;line-height:2}
.loading{
 width:32px;height:32px;border:3px solid #ffffff22;
 border-top-color:var(--purple);border-radius:50%;
 animation:spin .8s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none!important}
footer{text-align:center;padding:25px 0;color:#777d98;font-size:9px}

@media(max-width:760px){
 .container{width:calc(100% - 20px)}
 header{height:64px}
 .hero{min-height:270px;border-radius:19px}
 .hero-content{padding:27px 20px;max-width:95%}
 .hero-shade{background:linear-gradient(90deg,#090b19ee,#090b19b8)}
 .layout{grid-template-columns:1fr}
 .panel{padding:16px}
 .modes{grid-template-columns:1fr 1fr}
}
@media(max-width:390px){
 .modes{grid-template-columns:1fr}
 .hero p{font-size:11px}
 .levels{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

 if(game.slug==="tic-tac-toe"){

/* إحصائيات محلية */
function statsKey(slug){return "hanoon_game_stats_"+slug}

function readStats(slug){
 try{
  return JSON.parse(localStorage.getItem(statsKey(slug)))||{
   played:0,wins:0,losses:0,draws:0
  };
 }catch{
  return {played:0,wins:0,losses:0,draws:0};
 }
}

function saveResult(slug,result){
 const stats=readStats(slug);
 stats.played++;
 if(result==="win")stats.wins++;
 if(result==="loss")stats.losses++;
 if(result==="draw")stats.draws++;
 localStorage.setItem(statsKey(slug),JSON.stringify(stats));
 updateLocalStats(slug);
}

function updateLocalStats(slug){
 const s=readStats(slug);
 if($("statPlayed"))$("statPlayed").textContent=s.played;
 if($("statWins"))$("statWins").textContent=s.wins;
 if($("statDraws"))$("statDraws").textContent=s.draws;
}

}

 const s=xoState;
 if(!s)return;

 const levels=s.mode==="ai"?`
  <div class="notice">

   <div class="levels">

   </div>
  </div>`:"";

 $("board").innerHTML=`
  ${levels}
  <div class="scoreboard">
   <div class="player-score ${s.turn==="X"&&!s.ended?"active":""}" id="scoreX">
    <b>أنت · X</b><small>${s.turn==="X"&&!s.ended?"دورك الآن":""}</small>
   </div>
   <div class="vs">VS</div>
   <div class="player-score ${s.turn==="O"&&!s.ended?"active":""}" id="scoreO">
    <b>${s.mode==="ai"?"الذكاء الاصطناعي · O":"اللاعب الثاني · O"}</b>
    <small>${s.turn==="O"&&!s.ended?"دوره الآن":""}</small>
   </div>
  </div>
  <div class="game-message" id="xoMessage">
   ${s.ended?"انتهت المباراة":s.turn==="X"?"دورك الآن":"دور المنافس"}
  </div>
  <div class="xo-board" id="xoBoard">
   ${s.cells.map((v,i)=>`
    <button class="xo-cell ${v==="O"?"o":""}" data-cell="${i}" aria-label="مربع ${i+1}" ${v||s.ended?"disabled":""}>${v}</button>
   `).join("")}
  </div>
  <div class="game-actions">
   <button class="primary" id="xoRestart">مباراة جديدة</button>
   <button class="secondary" id="xoExit">إغلاق اللوحة</button>
  </div>
 `;

 $("board").querySelectorAll("[data-level]").forEach(btn=>{
  btn.addEventListener("click",()=>{
   if(s.cells.some(Boolean)){
    alert("ابدأ مباراة جديدة لتغيير المستوى.");
    return;
   }
   s.level=btn.dataset.level;
   drawXO();
  });
 });

 $("xoBoard").addEventListener("click",handleXOclick);
 $("xoRestart").addEventListener("click",()=>setXOmode(s.mode));
 $("xoExit").addEventListener("click",()=>{
  $("gameArea").classList.remove("show");
 });

 const aiTurn=s.mode==="ai"&&s.turn==="O"&&!s.ended;
 if(aiTurn){
  $("xoMessage").textContent="المنافس يفكر...";
  setTimeout(()=>{
   if(xoState!==s||s.ended||s.turn!=="O")return;
   const move=chooseAIMove(s.cells,s.level);
   if(move!==null)playXO(move,"O");
  },420);
 }
}

function handleXOclick(e){
 const btn=e.target.closest("[data-cell]");
 if(!btn||!xoState)return;
 const s=xoState;
 const index=Number(btn.dataset.cell);

 if(s.ended||s.cells[index])return;
 if(s.mode==="ai"&&s.turn!=="X")return;

 playXO(index,"X");
}

const XO_WINS=[
 [0,1,2],[3,4,5],[6,7,8],
 [0,3,6],[1,4,7],[2,5,8],
 [0,4,8],[2,4,6]
];

function getWinner(cells){
 for(const line of XO_WINS){
  const [a,b,c]=line;
  if(cells[a]&&cells[a]===cells[b]&&cells[a]===cells[c]){
   return {winner:cells[a],line};
  }
 }
 if(cells.every(Boolean))return {winner:"draw",line:[]};
 return null;
}

function playXO(index,mark){
 const s=xoState;
 if(!s||s.ended||s.cells[index])return;

 s.cells[index]=mark;
 const result=getWinner(s.cells);

 if(result){
  s.ended=true;
  finishXO(result);
  drawXO();
  highlightWinningLine(result.line);
  return;
 }

 s.turn=mark==="X"?"O":"X";
 drawXO();
}

function finishXO(result){
 const s=xoState;
 if(s.recorded)return;
 s.recorded=true;

 const message=$("xoMessage");

 if(result.winner==="draw"){
  message.textContent="تعادل! مباراة متكافئة.";
  if(s.mode==="ai")saveResult("tic-tac-toe","draw");
  else saveResult("tic-tac-toe","draw");
 }else if(result.winner==="X"){
  message.textContent="مبروك! أنت الفائز.";
  saveResult("tic-tac-toe","win");
 }else{
  message.textContent=s.mode==="ai"?"الذكاء الاصطناعي فاز هذه المرة.":"اللاعب الثاني فاز!";
  saveResult("tic-tac-toe",s.mode==="ai"?"loss":"loss");
 }
}

function highlightWinningLine(line){
 const board=$("xoBoard");
 if(!board)return;
 line.forEach(i=>board.children[i]?.classList.add("winner"));
}

/* الذكاء الاصطناعي */
function chooseAIMove(cells,level){
 const available=cells.map((v,i)=>v?null:i).filter(v=>v!==null);
 if(!available.length)return null;

 if(level==="easy"){
  return available[Math.floor(Math.random()*available.length)];
 }

 if(level==="medium"){
  const win=findImmediateMove(cells,"O");
  if(win!==null)return win;

  const block=findImmediateMove(cells,"X");
  if(block!==null)return block;

  return available[Math.floor(Math.random()*available.length)];
 }

 if(level==="hard"){
  const win=findImmediateMove(cells,"O");
  if(win!==null)return win;

  const block=findImmediateMove(cells,"X");
  if(block!==null)return block;

  return minimaxBestMove(cells);
 }

 if(level==="expert"){
  return minimaxBestMove(cells);
 }

 return available[Math.floor(Math.random()*available.length)];
}

function findImmediateMove(cells,mark){
 for(let i=0;i<9;i++){
  if(cells[i])continue;
  const test=cells.slice();
  test[i]=mark;
  const result=getWinner(test);
  if(result&&result.winner===mark)return i;
 }
 return null;
}

function minimaxBestMove(cells){
 const empty=cells.map((v,i)=>v?null:i).filter(v=>v!==null);
 let bestScore=-Infinity;
 let bestMoves=[];

 for(const index of empty){
  const test=cells.slice();
  test[index]="O";
  const score=minimax(test,false,0);

  if(score>bestScore){
   bestScore=score;
   bestMoves=[index];
  }else if(score===bestScore){
   bestMoves.push(index);
  }
 }

 return bestMoves[Math.floor(Math.random()*bestMoves.length)];
}

function minimax(cells,isMaximizing,depth){
 const result=getWinner(cells);

 if(result){
  if(result.winner==="O")return 10-depth;
  if(result.winner==="X")return depth-10;
  return 0;
 }

 if(isMaximizing){
  let best=-Infinity;
  for(let i=0;i<9;i++){
   if(cells[i])continue;
   cells[i]="O";
   best=Math.max(best,minimax(cells,false,depth+1));
   cells[i]="";
  }
  return best;
 }else{
  let best=Infinity;
  for(let i=0;i<9;i++){
   if(cells[i])continue;
   cells[i]="X";
   best=Math.min(best,minimax(cells,true,depth+1));
   cells[i]="";
  }
  return best;
 }
}

/* تحميل اللعبة من قاعدة البيانات */
async function loadGame(){
 if(!gameKey){
  showError("لم يتم تحديد اللعبة","ارجع لمكتبة الألعاب واختر اللعبة.");
  return;
 }

 try{
  const uuid=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(gameKey);

  let query=db.from("world_games_catalog")
   .select("id,slug,title_ar,title_en,description_ar,category,cover_path,route_key,is_active,sort_order");

  query=uuid?query.eq("id",gameKey):query.eq("slug",gameKey);

  const {data,error}=await query.maybeSingle();

  if(error)throw error;

  if(!data){
   showError("اللعبة غير موجودة","لم نعثر على اللعبة في مكتبة هنون.");
   return;
  }

  render(data);

 }catch(error){
  console.error("HANOON game:",error);
  showError(
   "تعذر تحميل اللعبة",
   "راجع اتصال الإنترنت وصلاحيات قراءة كتالوج الألعاب في Supabase ثم حاول مرة أخرى."
  );
 }
}

loadGame();
</script>
