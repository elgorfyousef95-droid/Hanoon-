<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090b18">
  <title>تفاصيل اللعبة | HANOON WORLD</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #090b18;
      --panel: rgba(22,25,45,.94);
      --purple: #a18aff;
      --gold: #edca83;
      --cyan: #68d9d5;
      --text: #f7f5ff;
      --muted: #a6a8bd;
      --line: rgba(255,255,255,.09);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 40px;
      background: var(--bg);
      color: var(--text);
      font-family: "Cairo", sans-serif;
    }

    button, a {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      cursor: pointer;
      color: inherit;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(180deg, rgba(7,9,20,.55), rgba(7,9,20,.91) 70%, #090b18),
        url("https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=2200&q=90")
        center top / cover no-repeat;
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(125,91,230,.18), transparent 38%),
        radial-gradient(ellipse at 90% 55%, rgba(48,174,183,.10), transparent 35%);
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: auto;
    }

    .topbar {
      height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 900;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: linear-gradient(145deg, #b49aff, #6845ce);
      box-shadow: 0 8px 25px rgba(126,91,226,.3);
    }

    .brand-icon svg {
      width: 24px;
      height: 24px;
      stroke: white;
      fill: none;
      stroke-width: 1.8;
    }

    .brand small {
      display: block;
      margin-top: -5px;
      color: var(--gold);
      font-size: 8px;
      letter-spacing: 2px;
    }

    .back-button {
      min-height: 40px;
      padding: 7px 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255,255,255,.06);
      color: #ded8f4;
      font-size: 11px;
      font-weight: 800;
    }

    .back-button svg {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 23px 0 17px;
      color: var(--muted);
      font-size: 11px;
    }

    .breadcrumb a {
      color: #c0adff;
    }

    .hero {
      position: relative;
      min-height: 370px;
      overflow: hidden;
      border: 1px solid rgba(190,171,255,.2);
      border-radius: 27px;
      background:
        linear-gradient(90deg, rgba(9,10,25,.97), rgba(9,10,25,.7) 55%, rgba(9,10,25,.18)),
        url("https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=1800&q=90")
        center / cover no-repeat;
      box-shadow: 0 25px 65px rgba(0,0,0,.35);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 620px;
      padding: 55px 42px;
    }

    .eyebrow {
      display: inline-flex;
      padding: 7px 13px;
      border: 1px solid rgba(237,202,131,.25);
      border-radius: 30px;
      background: rgba(237,202,131,.08);
      color: var(--gold);
      font-size: 10px;
      font-weight: 900;
    }

    .hero h1 {
      margin-top: 20px;
      font-size: clamp(32px, 5vw, 51px);
      font-weight: 900;
      line-height: 1.4;
    }

    .hero-description {
      max-width: 500px;
      margin-top: 12px;
      color: #d0cce0;
      font-size: 13px;
      line-height: 2.1;
    }

    .cover-image {
      position: absolute;
      inset: 0 45% 0 0;
      width: 55%;
      height: 100%;
      object-fit: cover;
      opacity: .75;
      mask-image: linear-gradient(270deg, transparent, black 35%);
      -webkit-mask-image: linear-gradient(270deg, transparent, black 35%);
    }

    .hero-placeholder {
      position: absolute;
      inset: 0 45% 0 0;
      display: grid;
      place-items: center;
      color: rgba(196,177,255,.65);
    }

    .hero-placeholder svg {
      width: 115px;
      height: 115px;
      stroke: currentColor;
      fill: none;
      stroke-width: .8;
      filter: drop-shadow(0 0 25px rgba(151,119,255,.4));
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      padding: 9px 13px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 12px;
      background: rgba(7,9,20,.55);
      font-size: 11px;
      font-weight: 900;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #e4a36f;
      box-shadow: 0 0 10px rgba(228,163,111,.6);
    }

    .status.active .status-dot {
      background: #63d7a0;
      box-shadow: 0 0 10px rgba(99,215,160,.6);
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 19px;
      margin-top: 22px;
      align-items: start;
    }

    .panel {
      padding: 25px;
      border: 1px solid var(--line);
      border-radius: 21px;
      background: var(--panel);
      box-shadow: 0 15px 40px rgba(0,0,0,.2);
      backdrop-filter: blur(15px);
    }

    .panel + .panel {
      margin-top: 18px;
    }

    .panel-title {
      margin-bottom: 15px;
      font-size: 17px;
      font-weight: 900;
    }

    .description {
      color: #c0bfd0;
      font-size: 13px;
      line-height: 2.2;
      white-space: pre-line;
    }

    .details-list {
      display: grid;
      gap: 12px;
    }

    .detail-item {
      min-height: 57px;
      padding: 11px 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 13px;
      background: rgba(255,255,255,.035);
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
    }

    .detail-value {
      color: #eeeaff;
      font-size: 12px;
      font-weight: 900;
      text-align: left;
    }

    .notice {
      padding: 17px;
      border: 1px solid rgba(237,202,131,.2);
      border-radius: 15px;
      background: rgba(237,202,131,.065);
    }

    .notice h3 {
      color: var(--gold);
      font-size: 13px;
      font-weight: 900;
    }

    .notice p {
      margin-top: 7px;
      color: #c6bfd0;
      font-size: 11px;
      line-height: 2;
    }

    .primary-button {
      width: 100%;
      min-height: 48px;
      margin-top: 18px;
      border: 0;
      border-radius: 13px;
      background: linear-gradient(120deg, #9277f1, #7050d2);
      color: white;
      font-size: 12px;
      font-weight: 900;
    }

    .primary-button:disabled {
      cursor: not-allowed;
      opacity: .55;
      filter: grayscale(.3);
    }

    .state {
      min-height: 330px;
      margin-top: 30px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid var(--line);
      border-radius: 23px;
      background: var(--panel);
    }

    .state-icon {
      width: 75px;
      height: 75px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(157,129,255,.22);
      border-radius: 22px;
      background: rgba(157,129,255,.1);
    }

    .state-icon svg {
      width: 38px;
      height: 38px;
      stroke: #c1b1ff;
      fill: none;
      stroke-width: 1.5;
    }

    .state h2 {
      margin-top: 17px;
      font-size: 18px;
      font-weight: 900;
    }

    .state p {
      max-width: 420px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 2;
    }

    .loading {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 760px) {
      .container {
        width: calc(100% - 22px);
      }

      .topbar {
        height: 66px;
      }

      .hero {
        min-height: 330px;
        border-radius: 21px;
        background-position: 60% center;
      }

      .hero-content {
        padding: 35px 21px;
        max-width: 90%;
      }

      .hero h1 {
        font-size: 34px;
      }

      .hero-description {
        font-size: 11px;
      }

      .cover-image,
      .hero-placeholder {
        inset: 0 30% 0 0;
        width: 70%;
        opacity: .35;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 19px;
      }
    }

    @media (max-width: 360px) {
      .brand {
        font-size: 12px;
      }

      .back-button {
        padding: 6px 9px;
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="background"></div>

  <div class="container">

    <header class="topbar">
      <a class="brand" href="home.html">
        <span class="brand-icon">
          <svg viewBox="0 0 24 24">
            <path d="M7 8h10a4 4 0 0 1 4 4v4a3 3 0 0 1-5 2l-2-2h-4l-2 2a3 3 0 0 1-5-2v-4a4 4 0 0 1 4-4Z"/>
            <path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/>
          </svg>
        </span>
        <span>
          HANOON WORLD
          <small>GAMES EXPERIENCE</small>
        </span>
      </a>

      <a class="back-button" href="games.html">
        <svg viewBox="0 0 24 24">
          <path d="m15 18-6-6 6-6"/>
        </svg>
        العودة للألعاب
      </a>
    </header>

    <div class="breadcrumb">
      <a href="home.html">الرئيسية</a>
      <span>/</span>
      <a href="games.html">الألعاب</a>
      <span>/</span>
      <span id="breadcrumbTitle">التفاصيل</span>
    </div>

    <main id="content">
      <section class="state">
        <div class="loading"></div>
        <h2>جارٍ تحميل تفاصيل اللعبة</h2>
        <p>لحظات ونجهز لك بيانات اللعبة.</p>
      </section>
    </main>

  </div>

  <script>
    const SUPABASE_URL = "https://gjtgvczvclfwvlvcquxh.supabase.co";
    const SUPABASE_KEY = "sb_publishable_4DVTUZ-xTlqU2GpFvpb7lw_g-Kxomd4";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const params = new URLSearchParams(location.search);
    const gameKey = params.get("game");

    const $ = id => document.getElementById(id);

    function esc(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function categoryName(category) {
      const names = {
        board: "ألعاب الطاولة",
        strategy: "ألعاب استراتيجية",
        quick: "ألعاب سريعة",
        cards: "ألعاب الورق",
        party: "ألعاب جماعية",
        puzzle: "ألغاز وتفكير"
      };

      return names[category] || category || "غير محدد";
    }

    function showState(title, description) {
      $("content").innerHTML = `
        <section class="state">
          <div class="state-icon">
            <svg viewBox="0 0 24 24">
              <path d="M7 8h10a4 4 0 0 1 4 4v4a3 3 0 0 1-5 2l-2-2h-4l-2 2a3 3 0 0 1-5-2v-4a4 4 0 0 1 4-4Z"/>
              <path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/>
            </svg>
          </div>
          <h2>${esc(title)}</h2>
          <p>${esc(description)}</p>
          <a class="primary-button" href="games.html" style="display:grid;place-items:center;text-decoration:none;">
            العودة إلى مكتبة الألعاب
          </a>
        </section>
      `;
    }

    function renderGame(game) {
      const title = game.title_ar || game.title_en || "لعبة";
      const description =
        game.description_ar ||
        game.description_en ||
        "لا يوجد وصف إضافي لهذه اللعبة.";

      $("breadcrumbTitle").textContent = title;
      document.title = title + " | HANOON WORLD";

      const players = game.min_players === game.max_players
        ? `${game.min_players} لاعبين`
        : `${game.min_players} - ${game.max_players} لاعبين`;

      const image = /^https?:\/\//i.test(game.cover_path || "")
        ? game.cover_path
        : "";

      const statusText = game.is_active
        ? "مفعّلة في قائمة الألعاب"
        : "غير متاحة حاليًا";

      $("content").innerHTML = `
        <section class="hero">

          ${
            image
              ? `<img class="cover-image" src="${esc(image)}" alt="${esc(title)}">`
              : `
                <div class="hero-placeholder">
                  <svg viewBox="0 0 24 24">
                    <path d="M7 8h10a4 4 0 0 1 4 4v4a3 3 0 0 1-5 2l-2-2h-4l-2 2a3 3 0 0 1-5-2v-4a4 4 0 0 1 4-4Z"/>
                    <path d="M8 11v4M6 13h4M16 12h.01M18 14h.01"/>
                  </svg>
                </div>
              `
          }

          <div class="hero-content">
            <span class="eyebrow">HANOON GAME COLLECTION</span>
            <h1>${esc(title)}</h1>
            <p class="hero-description">${esc(description)}</p>

            <span class="status ${game.is_active ? "active" : ""}">
              <span class="status-dot"></span>
              ${statusText}
            </span>
          </div>
        </section>

        <div class="layout">

          <div>
            <section class="panel">
              <h2 class="panel-title">عن اللعبة</h2>
              <p class="description">${esc(description)}</p>
            </section>

            <section class="panel">
              <h2 class="panel-title">حالة اللعبة</h2>

              ${
                game.is_active
                  ? `
                    <div class="notice">
                      <h3>اللعبة مفعّلة في المكتبة</h3>
                      <p>
                        اللعبة مفعّلة في سجل الألعاب. توفر تجربة اللعب الفعلية
                        يعتمد على ربط واجهة اللعبة ونظام الجلسات الخاص بها.
                      </p>
                    </div>
                  `
                  : `
                    <div class="notice">
                      <h3>اللعبة غير متاحة حاليًا</h3>
                      <p>
                        هذه اللعبة مسجلة في قاعدة بيانات هنون، لكنها غير مفعّلة
                        حاليًا. لن نعرض خيار دخول غير متاح.
                      </p>
                    </div>
                  `
              }
            </section>
          </div>

          <aside>
            <section class="panel">
              <h2 class="panel-title">معلومات اللعبة</h2>

              <div class="details-list">

                <div class="detail-item">
                  <span class="detail-label">التصنيف</span>
                  <span class="detail-value">${esc(categoryName(game.category))}</span>
                </div>

                <div class="detail-item">
                  <span class="detail-label">عدد اللاعبين</span>
                  <span class="detail-value">${esc(players)}</span>
                </div>

                <div class="detail-item">
                  <span class="detail-label">الاسم الإنجليزي</span>
                  <span class="detail-value">${esc(game.title_en || "—")}</span>
                </div>

                <div class="detail-item">
                  <span class="detail-label">الحالة</span>
                  <span class="detail-value">${game.is_active ? "مفعّلة" : "غير مفعّلة"}</span>
                </div>

              </div>

              <button
                class="primary-button"
                id="gameAction"
                ${game.is_active ? "" : "disabled"}
                type="button"
              >
                ${game.is_active ? "اللعبة مفعّلة — تفاصيل الدخول غير مربوطة" : "اللعبة غير متاحة حاليًا"}
              </button>

              <a
                href="games.html"
                class="back-button"
                style="justify-content:center;margin-top:12px;"
              >
                العودة إلى جميع الألعاب
              </a>
            </section>
          </aside>

        </div>
      `;
    }

    async function loadGame() {
      if (!gameKey) {
        showState(
          "لم يتم تحديد لعبة",
          "ارجع إلى مكتبة الألعاب واختر اللعبة التي تريد معرفة تفاصيلها."
        );
        return;
      }

      try {
        const isUUID =
          /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(gameKey);

        let query = db
          .from("world_games_catalog")
          .select(`
            id,
            slug,
            title_ar,
            title_en,
            description_ar,
            description_en,
            category,
            min_players,
            max_players,
            cover_path,
            route_key,
            is_active,
            sort_order,
            settings
          `);

        query = isUUID
          ? query.eq("id", gameKey)
          : query.eq("slug", gameKey);

        const { data, error } = await query.maybeSingle();

        if (error) throw error;

        if (!data) {
          showState(
            "اللعبة غير موجودة",
            "لم نعثر على لعبة بهذا المعرف في قاعدة بيانات المنصة."
          );
          return;
        }

        renderGame(data);

      } catch (error) {
        console.error("HANOON game details:", error);

        showState(
          "تعذر تحميل تفاصيل اللعبة",
          "حدث خطأ أثناء الاتصال بقاعدة البيانات. حاول مرة أخرى لاحقًا."
        );
      }
    }

    loadGame();
  </script>
</body>
</html>
